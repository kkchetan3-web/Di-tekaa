name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'tools/make-www.sh', '.github/workflows/apk.yml', 'index.html', 'enhanced.html', 'src/**', 'vendor/**', 'assets/**']

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle (www/)
        run: bash tools/make-www.sh

      - name: Sync web bundle into the Android project (copy + regenerate native bridge)
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble debug APK (log captured)
        run: |
          chmod +x android/gradlew
          set -o pipefail
          android/gradlew -p android assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: On failure — report log tail as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 24000 /tmp/build.log > /tmp/tail.txt || echo "no log captured" > /tmp/tail.txt
          gh issue create --title "APK build failed (${GITHUB_SHA:0:7})" \
            --body "$(cat /tmp/tail.txt)" || true

      - name: On success — publish APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DiTekaaaa-debug.apk
          gh release create "apk-v${GITHUB_RUN_NUMBER}" DiTekaaaa-debug.apk \
            --title "Di Tekaaaa! APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK of the Di Tekaaaa! reconstruction (com.ditekaaaa.game).
          Install: download DiTekaaaa-debug.apk on an Android device and open it
          (allow 'install unknown apps' for your browser/file manager). Landscape, minSdk 22."
